services:
  agent:
    build: ./agent
    ports:
      - "9000:9000"
    env_file: .env
    environment:
      - TOOLS_URL=http://tools:7000
      - REDIS_HOST=redis
    depends_on: [tools, redis]
    restart: unless-stopped

  tools:
    build: ./tools
    restart: unless-stopped
    # NOTE: no ports! Explained below - this is the security gem

  redis:
    image: redis:7-alpine
    volumes:
      - agent_memory:/data
    restart: unless-stopped

volumes:
  agent_memory:
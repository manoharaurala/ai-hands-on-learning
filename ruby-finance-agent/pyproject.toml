[project]
name = "ruby-finance-agent"
version = "0.1.0"
description = "Finance agent project"
readme = "README.md"
authors = [
    { name = "manoharaurala", email = "manoharaurala@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai-agents",
    "yfinance",
    "python-dotenv",
    "certifi",
    "langgraph>=1.2.21",
    "gradio>=6.32.0",
]

[project.scripts]
ruby-finance-agent = "ruby_finance_agent:main"
ruby-finance-agent-ui = "ruby_finance_agent.ui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pylint>=4.1.3",
]

[tool.black]
line-length = 80
target-version = ["py314"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.messages_control]
disable = [
    # Provider errors are sanitized before returning from boundary functions.
    "broad-exception-caught",
    # Compact CLI, provider fallback branches, and calculation helpers.
    "too-many-locals",
    "too-many-return-statements",
]
